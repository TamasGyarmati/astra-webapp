<h1>Update teacher</h1>

<div class="my-container">
  <mat-form-field appearance="outline">
    <mat-label>ID</mat-label>
    <input matInput [(ngModel)]="this.teacher().id" disabled />
    <mat-icon matSuffix>text_fields</mat-icon>
    <mat-hint>ID of the teacher</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="this.teacher().name" />
    <mat-icon matSuffix>text_fields</mat-icon>
    <mat-hint>Name of the teacher</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Neptun code</mat-label>
    <input matInput [(ngModel)]="this.teacher().neptun" />
    <mat-icon matSuffix>text_fields</mat-icon>
    <mat-hint>Neptun code of the teacher</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Image URL</mat-label>
    <input matInput [(ngModel)]="this.teacher().image" />
    <mat-icon matSuffix>text_fields</mat-icon>
    <mat-hint>Image link of the teacher</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Birth Year</mat-label>
    <input matInput [(ngModel)]="this.teacher().birthYear" />
    <mat-icon matSuffix>text_fields</mat-icon>
    <mat-hint>Birth year of the teacher</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Creator name</mat-label>
    <input matInput [(ngModel)]="this.teacher().creatorName" />
    <mat-icon matSuffix>text_fields</mat-icon>
    <mat-hint>Name of the creator</mat-hint>
  </mat-form-field>

  <mat-checkbox [(ngModel)]="this.deleteDisabled"> Uncheck to delete! </mat-checkbox>

  <div class="buttons">
    <button mat-flat-button color="accent" class="edit-button" (click)="updateTeacher()">
      Update teacher
    </button>
    <button
      mat-flat-button
      color="warning"
      (click)="deleteTeacher()"
      [disabled]="this.deleteDisabled"
      class="delete-button"
    >
      Delete teacher
    </button>
  </div>
</div>
